name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'dependabot/**']
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make workspace-check
      - run: make docs-check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: registry/go.mod
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint -color
      - run: shellcheck tools/e2e/*.sh tools/deploy/rivet-runsc-query
      - run: python3 -m unittest discover -s tools/ci -p 'test_*.py'

  product:
    needs: workspace
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rivet
        with:
          cache-key: product
      - run: python3 tools/ci/receipt.py "$RUNNER_TEMP/evidence/source.json"
      - run: make cli-test
      - run: make cli-clippy
      - run: make fmt-check
      - run: make registry-test
      - run: make audit-agent-check
      - run: cd registry && go vet ./...
      - name: Registry race detector and coverage
        run: cd registry && go test -race -count=1 -coverprofile="$RUNNER_TEMP/evidence/go-coverage.out" ./...
      - name: Preserve evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14

  portable-seed:
    needs: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rivet
        with:
          cache-key: compatibility
      - run: python3 tools/ci/receipt.py "$RUNNER_TEMP/evidence/source.json"
      - name: Create shared portable lock with public test identity
        run: |
          python3 -u tools/e2e/compatibility.py --native             --lock-output "$RUNNER_TEMP/portable/rivet.lock"             --evidence-dir "$RUNNER_TEMP/evidence" 2>&1 | tee "$RUNNER_TEMP/evidence/console.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-lock
          path: ${{ runner.temp }}/portable/rivet.lock
          if-no-files-found: error
          retention-days: 7
      - name: Preserve evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-seed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14

  compatibility:
    needs: portable-seed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rivet
        with:
          cache-key: compatibility
      - run: python3 tools/ci/receipt.py "$RUNNER_TEMP/evidence/source.json"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: portable-lock
          path: ${{ runner.temp }}/portable
      - name: Shared frozen lock, signed peers, and real projects
        run: |
          python3 -u tools/e2e/compatibility.py --native --corpus             --lock-input "$RUNNER_TEMP/portable/rivet.lock"             --evidence-dir "$RUNNER_TEMP/evidence" 2>&1 | tee "$RUNNER_TEMP/evidence/console.log"
      - name: Preserve evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: workspace
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rivet
        with:
          cache-key: e2e
      - run: python3 tools/ci/receipt.py "$RUNNER_TEMP/evidence/source.json"
      - name: Live npm, tamper, revocation, and sandbox checks in temp and HOME
        run: make e2e 2>&1 | tee "$RUNNER_TEMP/evidence/console.log"
        env:
          RIVET_E2E_BENCH_OUT: ${{ runner.temp }}/evidence/bench.jsonl
          RIVET_E2E_LOG_DIR: ${{ runner.temp }}/evidence
      - name: Preserve evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14

  audit-trace:
    needs: workspace
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rivet
        with:
          cache-key: audit-trace
      - run: python3 tools/ci/receipt.py "$RUNNER_TEMP/evidence/source.json"
      - name: Live gVisor certification and native adversarial probes
        run: tools/e2e/audit-trace.sh 2>&1 | tee "$RUNNER_TEMP/evidence/audit-trace.log"
      - name: Preserve evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-trace-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14

  postgres:
    needs: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rivet
          POSTGRES_PASSWORD: rivet
          POSTGRES_DB: rivet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rivet" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rivet
        with:
          cache-key: postgres
      - run: python3 tools/ci/receipt.py "$RUNNER_TEMP/evidence/source.json"
      - run: make registry-test-postgres
        env:
          RIVET_TEST_DATABASE_URL: postgres://rivet:rivet@localhost:5432/rivet_test?sslmode=disable
      - name: Production startup, authorization, and restart persistence
        run: python3 -u tools/e2e/production.py
        env:
          RIVET_TEST_DATABASE_URL: postgres://rivet:rivet@localhost:5432/rivet_test?sslmode=disable
          RIVET_PRODUCTION_EVIDENCE: ${{ runner.temp }}/evidence
      - name: Preserve evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14

  dependency-security:
    needs: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rivet
        with:
          cache-key: dependency-security
      - run: python3 tools/ci/receipt.py "$RUNNER_TEMP/evidence/source.json"
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Rust advisory database
        run: cargo audit --deny unsound --json > "$RUNNER_TEMP/evidence/cargo-audit.json"
      - name: Install Go scanner with its required build toolchain
        if: success() || failure()
        run: GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Go reachable vulnerabilities
        if: success() || failure()
        run: cd registry && govulncheck -json ./... > "$RUNNER_TEMP/evidence/govulncheck.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-security-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14

  required:
    name: Rivet required checks
    # Superseded runs must stop instead of reporting cancelled jobs as failures.
    if: ${{ !cancelled() }}
    needs: [workspace, product, portable-seed, compatibility, e2e, audit-trace, postgres, dependency-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed, was cancelled, or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failures = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          print(json.dumps(results, indent=2))
          if failures:
              raise SystemExit(f"Required checks did not pass: {failures}")
          PYCODE
