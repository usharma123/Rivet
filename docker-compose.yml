services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rivet
      POSTGRES_USER: rivet
      POSTGRES_PASSWORD: rivet
    ports:
      - "5432:5432"
    volumes:
      - rivet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivet -d rivet"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rivet-postgres:

